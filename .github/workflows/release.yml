# Publishes a release for every tag v<version>: checks that the tag, the plugin header and
# readme.txt agree, builds admin-menu-swap.zip (folder admin-menu-swap/, which WordPress
# installs) and attaches it. Sites find it through the plugin's Update URI.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^ \* Version: *//p' admin-menu-swap.php)"
          copy="$(sed -n "s/^amswap_register_copy( '\([^']*\)'.*/\1/p" admin-menu-swap.php)"
          stable="$(sed -n 's/^Stable tag: *//p' readme.txt)"
          if [ "$tag" != "$header" ] || [ "$tag" != "$copy" ] || [ "$tag" != "$stable" ]; then
            echo "Tag $tag, header $header, amswap_register_copy $copy and Stable tag $stable must match."
            exit 1
          fi

      - name: Build the zip
        run: git archive --format=zip --prefix=admin-menu-swap/ -o admin-menu-swap.zip HEAD

      - name: Release notes from readme.txt
        run: |
          awk -v head="= ${GITHUB_REF_NAME#v} =" '$0 == head { found = 1; next } /^= / { if (found) exit } found' readme.txt > notes.md
          test -s notes.md || echo "See readme.txt." > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" admin-menu-swap.zip --title "Admin Menu Swap ${GITHUB_REF_NAME#v}" --notes-file notes.md
